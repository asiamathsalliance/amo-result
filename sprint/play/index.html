<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Multiplication Sprint — AMO</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="icon" type="image/png" href="../../favicon-final.png?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="top-bar">
        <a href="../../index.html">
            <img src="../../logo.png" alt="Asia Math Alliance" class="top-logo">
        </a>

        <button id="navToggle" class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="siteNav">
            <span></span><span></span><span></span>
        </button>

        <nav id="siteNav" class="top-texts">
            <button id="navClose" class="nav-close" aria-label="Close menu">&times;</button>
            <a href="../../index.html" class="nav-item nav-item--link">Home</a>
            <a href="../../index.html#aboutSection" class="nav-item nav-item--link">About</a>
            <a href="../../index.html#amcSection" class="nav-item nav-item--link">AMO Preliminary</a>
            <a href="../../index.html#multiplicationSection" class="nav-item nav-item--link">Multiplication Game</a>
            <a href="../../leaderboard/" class="nav-item nav-item--link">Leaderboard</a>
            <button type="button" class="nav-contact contact-nav">Contact Us</button>
        </nav>
    </header>

    <div id="navOverlay" class="nav-overlay"></div>

    <main>
        <section class="section-block game-page sprint-play-page">
            <div id="sprintCountdown" class="sprint-countdown" aria-live="polite">
                <p id="sprintCountdownText" class="sprint-countdown-text">3</p>
            </div>

            <div id="sprintGameShell" class="game-shell sprint-game-shell">
                <p class="sprint-alias-bar">Playing as <strong id="sprintAliasDisplay"></strong></p>

                <div id="gamePlayPanel" class="game-panel">
                    <div class="game-stats-bar">
                        <div class="game-stat">
                            <span class="game-stat-label">Score</span>
                            <span class="game-stat-value" id="gameScore">0</span>
                        </div>
                        <div class="game-stat">
                            <span class="game-stat-label">Correct</span>
                            <span class="game-stat-value" id="gameCorrect">0</span>
                        </div>
                        <div class="game-stat">
                            <span class="game-stat-label">Time</span>
                            <span class="game-stat-value game-timer-value" id="gameTimer">5</span>
                        </div>
                    </div>

                    <div class="game-timer-bar" aria-hidden="true">
                        <div class="game-timer-fill" id="gameTimerFill"></div>
                    </div>

                    <div class="game-card-wrap">
                        <span class="label-chip game-streak-badge" id="gameStreakBadge">0 streak</span>
                        <div class="game-card" id="gameCard">
                            <p class="game-question" id="gameQuestion" aria-live="polite">
                                <span class="game-operand" id="gameOperandA">?</span>
                                <span class="game-times">×</span>
                                <span class="game-operand" id="gameOperandB">?</span>
                            </p>
                            <hr class="game-answer-divider">
                            <input
                                type="text"
                                inputmode="numeric"
                                autocomplete="off"
                                id="gameAnswerInput"
                                class="game-answer-input"
                                placeholder="Your answer"
                                aria-label="Answer"
                            >
                        </div>
                    </div>

                    <div class="game-keypad" id="gameKeypad">
                        <button type="button" class="game-key" data-key="1">1</button>
                        <button type="button" class="game-key" data-key="2">2</button>
                        <button type="button" class="game-key" data-key="3">3</button>
                        <button type="button" class="game-key" data-key="4">4</button>
                        <button type="button" class="game-key" data-key="5">5</button>
                        <button type="button" class="game-key" data-key="6">6</button>
                        <button type="button" class="game-key" data-key="7">7</button>
                        <button type="button" class="game-key" data-key="8">8</button>
                        <button type="button" class="game-key" data-key="9">9</button>
                        <button type="button" class="game-key game-key--clear" data-key="clear">⌫</button>
                        <button type="button" class="game-key" data-key="0">0</button>
                        <button type="button" class="game-key game-key--submit" data-key="submit">Go</button>
                    </div>
                </div>

                <div id="gameResultsPanel" class="game-panel">
                    <div class="game-results-card">
                        <div id="resultsLoading" class="results-skeleton" aria-hidden="false">
                            <div class="skeleton-line skeleton-line--title" aria-hidden="true"></div>
                            <div class="skeleton-line skeleton-line--sub" aria-hidden="true"></div>
                            <div class="skeleton-line skeleton-line--hero" aria-hidden="true"></div>
                            <div class="skeleton-line skeleton-line--label" aria-hidden="true"></div>
                            <div class="results-skeleton-grid" aria-hidden="true">
                                <div class="skeleton-stat"></div>
                                <div class="skeleton-stat"></div>
                                <div class="skeleton-stat"></div>
                            </div>
                            <div class="results-skeleton-actions" aria-hidden="true">
                                <div class="skeleton-btn"></div>
                                <div class="skeleton-btn"></div>
                                <div class="skeleton-btn"></div>
                            </div>
                        </div>
                        <div id="resultsContent" class="results-content is-hidden">
                            <h2>Sprint Complete</h2>
                            <p class="game-results-sub">Multiplication Sprint — 5 seconds</p>
                            <p id="resultsSaveStatus" class="results-save-status" aria-live="polite"></p>
                            <p class="game-results-score" id="resultsCorrectHero">0</p>
                            <p class="game-results-score-label">Correct answers</p>
                            <div class="game-results-grid">
                                <div class="game-results-stat">
                                    <span class="game-results-stat-label">Points</span>
                                    <span class="game-results-stat-value" id="resultsScore">0</span>
                                </div>
                                <div class="game-results-stat">
                                    <span class="game-results-stat-label">Accuracy</span>
                                    <span class="game-results-stat-value" id="resultsAccuracy">0%</span>
                                </div>
                                <div class="game-results-stat">
                                    <span class="game-results-stat-label">Best Streak</span>
                                    <span class="game-results-stat-value" id="resultsStreak">0</span>
                                </div>
                            </div>
                            <div class="game-results-actions">
                                <button type="button" id="gameTryAgainBtn" class="btn-secondary game-start-btn">Play Again</button>
                                <button type="button" id="sprintViewLeaderboardBtn" class="btn-secondary game-start-btn">View Leaderboard</button>
                                <button type="button" id="sprintBackHomeBtn" class="btn-secondary game-start-btn game-start-btn--outline">Back to Home</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-bottom">
                <p>&copy; 2026 Asia Math Alliance. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../../js/site-base.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="../../js/result-confetti.js"></script>
    <script src="../../js/alias-moderation.js"></script>
    <script src="../../js/supabase-config.js"></script>
    <script src="../../js/supabase-config.local.js"></script>
    <script src="../../js/supabase-client.js"></script>
    <script src="../../js/sprint-session.js"></script>
    <script src="../../js/sprint-utils.js"></script>
    <script src="../../js/sprint-engine.js"></script>
    <script src="../../js/sprint-play.js"></script>
    <script src="../../js/page-nav.js"></script>
</body>
</html>
